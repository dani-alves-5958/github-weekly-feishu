[metadata]
name = github-weekly-feishu
version = 0.1.0
description = Convert GitHub weekly Markdown notes into Feishu and Word friendly DOCX files.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = dani-alves-5958
url = https://github.com/dani-alves-5958/github-weekly-feishu
project_urls =
    Repository = https://github.com/dani-alves-5958/github-weekly-feishu
    Issues = https://github.com/dani-alves-5958/github-weekly-feishu/issues
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Office/Business :: Office Suites
    Topic :: Text Processing :: Markup :: Markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    python-docx>=1.1.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    github-weekly-feishu = github_weekly_feishu.cli:main

[options.extras_require]
dev =
    pytest>=8.0
